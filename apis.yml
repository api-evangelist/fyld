aid: fyld
name: FYLD
description: >-
  FYLD is an AI-native frontline intelligence platform for the global critical-infrastructure
  sector, turning field-operations data into real-time, structured intelligence for utilities,
  energy, and heavy-civils operators. Its products include the FYLD Platform for work execution,
  FYLD Control Room for remote supervision, and FYLD ShowMe for customer self-service reporting,
  serving managers, fieldworkers, contractors, and civil engineers via web and mobile (iOS and
  Android) apps. FYLD is a Partech portfolio company. As of this profile FYLD publishes no public
  developer API, SDKs, or developer portal; integration is delivered through partnerships such as
  Procore, and this record captures its public identity, security, and trust surface.
